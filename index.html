<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>SMART COUNTER</h1>
        <div id="count-display">0</div>
        <div class="buttons">
            <button id="btn-decrease">-1</button>
            <button id="btn-reset">AC</button>
            <button id="btn-increase">+1</button>
        </div>
        <p>Steps Options:</p>
        <div class="steps-buttons">
            <button id="btn-minus5">-5</button>
            <button id="btn-minus10">-10</button>
            <button id="btn-minus20">-20</button>

            <button id="btn-plus5">+5</button>
            <button id="btn-plus10">+10</button>
            <button id="btn-plus20">+20</button>
        </div>
    </div>
    <script type="text/javascript" src="script.js"> </script>
</body>
</html>
